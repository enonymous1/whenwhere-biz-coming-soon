# Deploy the WhenWhere.biz coming-soon page to GitHub Pages.
#
# A static page — no build step, no backend server of its own.
# Split by language (index.html, style.css, config.js, app.js) so
# GitHub's language stats read true. Every push to main deploys it
# as-is, so the live page is always current with the repo. The email
# signup POSTs to an Apps Script Web app (LAUNCH_LIST_ENDPOINT in
# config.js); the script and its setup are in apps-script/ and docs/.
#
# One-time setup (repo owner): Settings -> Pages -> Build and deployment
# -> Source: GitHub Actions. Then push to main and watch this run.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege per job: the build job only reads the repo
# (inherited from here); the deploy job adds Pages write + OIDC
# in its own permissions block below.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

  # Deploy is its own job. Two reasons, both learned the hard way:
  #
  # 1. A re-run of the deploy job alone never re-uploads the
  #    artifact, so a re-run can never produce the "multiple
  #    artifacts named github-pages" failure that re-running a
  #    single build-and-deploy job causes (each attempt uploads
  #    another copy onto the same run, and deploy-pages refuses
  #    to pick one).
  #
  # 2. The job handoff puts a gap between the upload and the
  #    deploy step's artifact lookup, which the single-job layout
  #    lacked when run 45584574599's deploy found 0 artifacts
  #    three times in a row with the artifact present and
  #    finalised (164,774 bytes, ID 15008407485). Honest caveat:
  #    the split does not guarantee the visibility lag is gone —
  #    if a deploy still finds 0 artifacts, the next move is a
  #    poll step that waits until the API lists `github-pages`
  #    before deploying, not another re-run.
  #
  # No checkout here: deploy-pages only needs the uploaded artifact.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
